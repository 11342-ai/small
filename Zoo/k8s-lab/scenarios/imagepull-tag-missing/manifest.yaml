# 场景：tag 不存在导致拉镜像失败
#
# 仓库（docker.io/library/busybox）存在，但 tag 不存在 → CRI 把 registry 的 404 原样透传给
# kubelet，事件与 state_message 里是带镜像引用的 not found。与"私有仓库缺凭据"的分界：
# 后者带 pull access denied / unauthorized，本场景没有配任何 imagePullSecrets 也不该被读成缺凭据。
# 注意本场景与冒烟台（smoke.yaml 的 badimg/badweb）用的是同一个镜像写法，那不是重复：
# 冒烟台管"采集链路通不通"，这里管"评测集里这一类症状长什么样"。
apiVersion: v1
kind: Pod
metadata:
  name: badtag
  namespace: diag-lab
  labels:
    app: badtag
    lab: imagepull-tag-missing
spec:
  containers:
    - name: app
      image: busybox:1.36-nope
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
