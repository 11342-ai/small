# 场景：requests 超过节点可分配（Pending 的资源分支）
#
# 故意开一个任何本地节点都放不下的 requests：调度器直接 FailedScheduling（Insufficient），
# Pod 永远停在 Pending。这条场景验证的是"节点分配账本"这一侧的证据：
# free_on_node 与 Pod 自己的 requests 要能对上（limit 写同样大是为了让模型不能靠 limits 猜）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-res
  namespace: diag-lab
  labels:
    lab: pending-insufficient-resources
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-res
  template:
    metadata:
      labels:
        app: pending-res
        lab: pending-insufficient-resources
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "100"
              memory: 200Gi
            limits:
              cpu: "100"
              memory: 200Gi
