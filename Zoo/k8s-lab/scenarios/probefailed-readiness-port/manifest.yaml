# 场景：readiness 探针端口错（Probe Failed 的端口分支）
#
# 与 restart-liveness-kill 共用同一个"应用正常但探针配置错"的形态，差别在探针种类：
# readiness 失败不会杀容器，只会把 Pod 一直卡在 NotReady（conditions.Ready=False），
# restartCount 恒为 0——这条就是用来区分"探针错导致重启"与"探针错导致不可用"的。
# 应用监听 8080，探针探 8081，事件里同样是 connection refused。
# 就绪条件用 pod_ready=False（+ phase=Running 确保容器已起来）：只看 phase 的话
# 容器还没拉起来时也是 Running，会把"还没起"误当成就绪。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probefailed-readiness
  namespace: diag-lab
  labels:
    lab: probefailed-readiness-port
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probefailed-readiness
  template:
    metadata:
      labels:
        app: probefailed-readiness
        lab: probefailed-readiness-port
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ["mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
